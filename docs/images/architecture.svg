<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="32" font-size="18" font-weight="600" fill="#0f172a">Gatherly — high-level architecture</text>
  <text x="24" y="52" fill="#475569">One deployable unit (API + web app) in front of Postgres. Solid = built in the MVP. Dashed = designed, not built.</text>

  <!-- Clients -->
  <g>
    <rect x="24" y="80" width="420" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="102" font-weight="600" fill="#0f172a">Clients</text>

    <rect x="40" y="114" width="190" height="62" rx="6" fill="#ffffff" stroke="#334155"/>
    <text x="52" y="136" font-weight="600" fill="#0f172a">Web SPA</text>
    <text x="52" y="154" fill="#475569">React, Vite, TanStack Query</text>
    <text x="52" y="169" fill="#475569">same origin, session cookie</text>

    <rect x="248" y="114" width="180" height="62" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="260" y="136" font-weight="600" fill="#475569">iOS / Android (later)</text>
    <text x="260" y="154" fill="#64748b">React Native, same API</text>
    <text x="260" y="169" fill="#64748b">bearer token (OIDC + PKCE)</text>
  </g>

  <!-- Users -->
  <g fill="#475569">
    <text x="470" y="104" font-weight="600" fill="#0f172a">Who uses it</text>
    <text x="470" y="126">Organizer — creates and manages events</text>
    <text x="470" y="146">Attendee — registers, cancels</text>
    <text x="470" y="166">Admin — manages users and the platform</text>
    <text x="470" y="186" font-size="12" fill="#64748b">Organizer = plan entitlement events:create</text>
  </g>

  <!-- Shared package -->
  <g>
    <rect x="760" y="80" width="216" height="110" rx="8" fill="#fefce8" stroke="#ca8a04"/>
    <text x="776" y="102" font-weight="600" fill="#0f172a">packages/shared</text>
    <text x="776" y="124" fill="#475569">Zod schemas and DTO types</text>
    <text x="776" y="142" fill="#475569">Error codes, enums, entitlements</text>
    <text x="776" y="160" fill="#475569">Imported by API and web, so</text>
    <text x="776" y="176" fill="#475569">validation and types cannot drift</text>
  </g>

  <!-- Deployable unit -->
  <g>
    <rect x="24" y="230" width="720" height="200" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="40" y="252" font-weight="600" fill="#1e3a8a">One container: Node 22, Fastify (stateless, scales horizontally)</text>

    <rect x="40" y="266" width="470" height="158" rx="6" fill="#ffffff" stroke="#334155"/>
    <text x="54" y="288" font-weight="600" fill="#0f172a">REST API  /api/v1</text>
    <text x="54" y="310" fill="#475569">1. Zod validation at the boundary (400 with field errors)</text>
    <text x="54" y="328" fill="#475569">2. Guards: session → suspended → admin → entitlement → ownership</text>
    <text x="54" y="346" fill="#475569">3. Modules: auth · events · registrations · organizer · admin · billing</text>
    <text x="54" y="364" fill="#475569">4. Errors as RFC 9457 problem+json with a stable code</text>
    <text x="54" y="384" fill="#475569" font-size="12">Sessions in Postgres (HttpOnly cookie, hashed token) · rate limits</text>
    <text x="54" y="398" fill="#475569" font-size="12">Security headers · OpenAPI at /api/docs · Drizzle, parameterised SQL</text>
    <text x="54" y="412" fill="#475569" font-size="12">Migrations run before the server starts</text>

    <rect x="526" y="266" width="200" height="66" rx="6" fill="#ffffff" stroke="#334155"/>
    <text x="540" y="288" font-weight="600" fill="#0f172a">Static files</text>
    <text x="540" y="306" fill="#475569">Built SPA and images,</text>
    <text x="540" y="322" fill="#475569">served from the same origin</text>

    <rect x="526" y="348" width="200" height="68" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="540" y="370" font-weight="600" fill="#475569">Telemetry SDKs</text>
    <text x="540" y="388" fill="#64748b">OpenTelemetry → Grafana Cloud</text>
    <text x="540" y="404" fill="#64748b">Errors → Sentry (optional, env-gated)</text>
  </g>

  <!-- Later integrations -->
  <g>
    <rect x="760" y="230" width="216" height="200" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="776" y="252" font-weight="600" fill="#475569">Third parties (designed)</text>
    <text x="776" y="276" fill="#64748b">Stripe — subscriptions, tickets</text>
    <text x="776" y="296" fill="#64748b">Email — confirmations, reminders,</text>
    <text x="776" y="312" fill="#64748b">through a transactional outbox</text>
    <text x="776" y="334" fill="#64748b">OAuth / OIDC — Google, Apple</text>
    <text x="776" y="356" fill="#64748b">Push — APNs / FCM for mobile</text>
    <text x="776" y="384" fill="#64748b" font-size="12">Each behind a small interface;</text>
    <text x="776" y="400" fill="#64748b" font-size="12">payments are mocked today</text>
  </g>

  <!-- Postgres -->
  <g>
    <rect x="24" y="470" width="720" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="40" y="492" font-weight="600" fill="#14532d">Postgres 17 — the only state</text>

    <text x="40" y="516" fill="#0f172a" font-weight="600">users</text>
    <text x="40" y="532" fill="#475569" font-size="12">role: member | admin</text>
    <text x="40" y="546" fill="#475569" font-size="12">status, argon2id hash</text>

    <text x="190" y="516" fill="#0f172a" font-weight="600">events</text>
    <text x="190" y="532" fill="#475569" font-size="12">organizer_id → users</text>
    <text x="190" y="546" fill="#475569" font-size="12">starts_at, ends_at (UTC), timezone</text>
    <text x="190" y="560" fill="#475569" font-size="12">capacity, registered_count</text>
    <text x="190" y="574" fill="#475569" font-size="12">CHECK 0 ≤ count ≤ capacity</text>

    <text x="410" y="516" fill="#0f172a" font-weight="600">registrations</text>
    <text x="410" y="532" fill="#475569" font-size="12">event_id → events, user_id → users</text>
    <text x="410" y="546" fill="#475569" font-size="12">status: confirmed | cancelled | …</text>
    <text x="410" y="560" fill="#475569" font-size="12">partial UNIQUE (event_id, user_id)</text>
    <text x="410" y="574" fill="#475569" font-size="12">where status is active</text>

    <text x="634" y="516" fill="#0f172a" font-weight="600">sessions</text>
    <text x="634" y="532" fill="#475569" font-size="12">hashed token, expiry</text>
    <text x="634" y="556" fill="#0f172a" font-weight="600">plans, subscriptions</text>
    <text x="634" y="572" fill="#475569" font-size="12">entitlements per plan</text>

    <text x="40" y="604" fill="#14532d" font-size="12" font-weight="600">Capacity rule lives here:</text>
    <text x="196" y="604" fill="#475569" font-size="12">one conditional UPDATE … WHERE registered_count &lt; capacity, then INSERT, in one transaction. Postgres picks the winner.</text>
  </g>

  <!-- Arrows -->
  <!-- Web -> API -->
  <line x1="135" y1="176" x2="135" y2="266" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="142" y="222" fill="#475569" font-size="12">HTTPS, JSON</text>
  <!-- Mobile -> API (dashed) -->
  <line x1="338" y1="176" x2="338" y2="266" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <!-- API -> Postgres -->
  <line x1="275" y1="416" x2="275" y2="470" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="284" y="448" fill="#475569" font-size="12">SQL over TLS, transactions</text>
  <!-- Shared -> API and web (dashed) -->
  <path d="M 800 190 C 800 240, 600 220, 500 266" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text x="812" y="214" fill="#a16207" font-size="12">imported by API and web</text>
  <!-- API -> third parties (dashed) -->
  <line x1="744" y1="330" x2="760" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
</svg>
