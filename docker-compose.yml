name: gatherly

services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gatherly:gatherly@db:5432/gatherly
      DEMO_MODE: 'true'
    ports:
      - '${APP_PORT:-3000}:3000'

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly
      POSTGRES_DB: gatherly
    ports:
      - '${DB_PORT:-54329}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatherly -d gatherly']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
