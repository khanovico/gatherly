name: gatherly

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly
      POSTGRES_DB: gatherly
    ports:
      - '54329:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatherly -d gatherly']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
