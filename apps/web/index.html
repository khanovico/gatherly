<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gatherly — Community events, beautifully organized</title>
    <meta
      name="description"
      content="Discover local and online community events, save your seat in one click, and host events that fill up."
    />
    <meta name="theme-color" content="#5b3ff0" />
    <meta property="og:title" content="Gatherly" />
    <meta property="og:image" content="/images/og.webp" />
    <link rel="icon" type="image/webp" href="/images/brand/mark.webp" />
    <script>
      // Apply the saved theme before first paint (same key as next-themes) to avoid a flash.
      {
        const theme = localStorage.getItem('theme') ?? 'system';
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
